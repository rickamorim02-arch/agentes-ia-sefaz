<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#332174"><link rel="manifest" href="/manifest.webmanifest"><title>Agentes IA — SEFAZ-AL</title><style>
:root{font-family:system-ui,Arial;background:#f5f3fc;color:#241a45}*{box-sizing:border-box}body{margin:0}header{background:#332174;color:white;padding:20px 18px}h1{font-size:23px;margin:0}small{opacity:.8}main{max-width:800px;margin:auto;padding:14px 14px 90px}.card{background:white;border-radius:15px;padding:17px;margin-bottom:12px;box-shadow:0 2px 12px #25125a10}h2{font-size:17px;margin:0 0 10px}p{line-height:1.5}button,.button{background:#5938bb;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer}button.secondary{background:#eee9fa;color:#332174}input,textarea,select{width:100%;padding:11px;border:1px solid #d6cfe8;border-radius:9px;margin:5px 0 10px;font:inherit}textarea{min-height:80px}nav{position:fixed;bottom:0;background:white;box-shadow:0 -2px 15px #25125a20;display:flex;width:100%;justify-content:space-around;padding:8px 2px env(safe-area-inset-bottom)}nav button{background:transparent;color:#59478c;font-size:12px;padding:10px 5px}nav button.active{background:#eee9fa}.muted{color:#766d86;font-size:13px}.pill{display:inline-block;background:#ede8fc;border-radius:50px;padding:5px 10px;font-size:12px;margin:3px}.row{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#9b244b}ul{padding-left:20px}li{margin:7px 0}.hidden{display:none}</style></head><body><header><h1>Agentes IA</h1><small>SEFAZ-AL • Nível 3 • Ambiente independente</small></header><main id="app"></main><nav id="nav"></nav><script>
const KEY="agentes_sefaz_n3_v1";const tabs=["Painel","Importar","Diagnóstico","Agentes","Backup"];let tab="Painel";let state=load();function initial(){return {imports:[],records:[],agents:[{name:"Coordenador",role:"Prioriza o estudo"},{name:"Analista",role:"Identifica dificuldades"},{name:"Professor",role:"Sugere explicações"},{name:"Auditor",role:"Solicita conferência das fontes"}],notes:[],created:new Date().toISOString()}}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));return s&&Array.isArray(s.records)&&Array.isArray(s.imports)?s:initial()}catch{return initial()}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function el(id){return document.getElementById(id)}function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function card(title,html){return '<section class="card"><h2>'+title+'</h2>'+html+'</section>'}function render(){el("nav").innerHTML=tabs.map(t=>'<button class="'+(t===tab?"active":"")+'" data-tab="'+t+'">'+t+'</button>').join("");el("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let out="";if(tab==="Painel"){out=card("Central de estudos",'<p>Dados isolados do SEFAZ-AL. Nenhuma informação é enviada ao aplicativo original.</p><div class="row"><span class="pill">'+state.imports.length+' importações</span><span class="pill">'+state.records.length+' registros de questões</span><span class="pill">'+state.agents.length+' agentes</span></div>')+card("Como começar",'<p>1. Exporte uma cópia JSON do SEFAZ-AL.<br>2. Importe em <b>Importar</b>.<br>3. Consulte o diagnóstico e as prioridades.</p><p class="muted">O formato do backup real ainda precisa ser validado. Dados não reconhecidos são mantidos na cópia, sem gerar estatísticas inventadas.</p>')+card("Registro manual",'<label>Matéria</label><input id="subject" placeholder="Direito Tributário"><label>Assunto</label><input id="topic" placeholder="Lançamento"><label>Resultado</label><select id="correct"><option value="0">Errei</option><option value="1">Acertei</option></select><button id="add">Registrar questão</button>');}
if(tab==="Importar"){out=card("Importação somente leitura",'<p>Selecione um backup JSON exportado do SEFAZ-AL. O arquivo será copiado para o armazenamento deste aplicativo, sem modificar o original.</p><input id="file" type="file" accept=".json,application/json"><p id="importstatus" class="muted"></p>')+card("Histórico de importações",state.imports.length?'<ul>'+state.imports.map(x=>'<li>'+escapeHTML(x.name)+' — '+escapeHTML(x.date)+' ('+x.count+' registros reconhecidos)</li>').join("")+'</ul>':'<p class="muted">Nenhuma importação.</p>');}
if(tab==="Diagnóstico"){const groups={};state.records.forEach(r=>{let k=r.subject+" / "+r.topic;if(!groups[k])groups[k]={subject:r.subject,topic:r.topic,total:0,errors:0};groups[k].total++;if(!r.correct)groups[k].errors++});let ranked=Object.values(groups).sort((a,b)=>(b.errors/b.total)-(a.errors/a.total)||b.errors-a.errors);out=card("Prioridades adaptativas",ranked.length?ranked.map((g,i)=>'<p><b>'+(i+1)+'. '+escapeHTML(g.subject)+' — '+escapeHTML(g.topic)+'</b><br>'+g.errors+' erros / '+g.total+' questões ('+Math.round(g.errors/g.total*100)+'% de erros)<br><span class="muted">'+(g.errors?'Revisar teoria e praticar questões auditadas':'Manter revisão periódica')+'</span></p>').join(""):'<p class="muted">Registre questões ou importe dados compatíveis para obter prioridades.</p>')+card("Método",'<p>Ordenação inicial por proporção de erros, com desempate pela quantidade de erros. A recomendação é local e não altera o ciclo do SEFAZ-AL.</p>');}
if(tab==="Agentes"){out=card("Equipe de agentes",state.agents.map(a=>'<p><b>'+escapeHTML(a.name)+'</b><br><span class="muted">'+escapeHTML(a.role)+'</span></p>').join(""))+card("Arquitetura para IA real",'<p>Esta versão utiliza análise local determinística. Modelos de linguagem e execução multiagente exigem backend autenticado, controles de custo, registros de auditoria e aprovação para operações de escrita.</p>');}
if(tab==="Backup"){out=card("Seus dados",'<p>Armazenamento local deste navegador. Exporte backups regularmente: limpar dados do navegador pode apagar o histórico.</p><div class="row"><button id="export">Exportar backup</button><button class="secondary" id="install">Instalar app</button></div>')+card("Restaurar backup deste app",'<input type="file" id="restore" accept=".json,application/json"><p class="muted">A restauração substitui apenas os dados locais do Agentes IA após confirmação; nunca altera o SEFAZ-AL.</p>')+card("Apagar dados deste app",'<button class="danger" id="clear">Apagar dados locais</button>');}
el("app").innerHTML=out;if(tab==="Painel"){el("add").onclick=()=>{let subject=el("subject").value.trim(),topic=el("topic").value.trim();if(!subject||!topic)return alert("Informe matéria e assunto");state.records.push({subject,topic,correct:el("correct").value==="1",date:new Date().toISOString(),source:"manual"});save();render()}}
if(tab==="Importar"){el("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>15e6)throw Error("Arquivo acima de 15 MB");const data=JSON.parse(await f.text());let arr=Array.isArray(data)?data:Array.isArray(data.records)?data.records:Array.isArray(data.respostas)?data.respostas:[];let rows=arr.filter(r=>r&&typeof r==="object"&&typeof (r.subject??r.materia)==="string"&&typeof (r.topic??r.assunto)==="string"&&typeof (r.correct??r.acertou)==="boolean").map(r=>({subject:r.subject??r.materia,topic:r.topic??r.assunto,correct:r.correct??r.acertou,date:r.date??new Date().toISOString(),source:f.name}));let fingerprint=f.name+":"+f.size+":"+f.lastModified;if(state.imports.some(x=>x.fingerprint===fingerprint))throw Error("Este arquivo já foi importado");state.imports.push({name:f.name,date:new Date().toLocaleString("pt-BR"),count:rows.length,fingerprint,raw:data});state.records.push(...rows);try{save()}catch(e){state.imports.pop();state.records.splice(state.records.length-rows.length,rows.length);throw Error("Armazenamento insuficiente. Use arquivo menor.")}alert("Cópia importada. "+rows.length+" registros compatíveis identificados.");render()}catch(err){el("importstatus").textContent="Erro: "+err.message}}}
if(tab==="Backup"){el("export").onclick=()=>{let blob=new Blob([JSON.stringify({schema:"agentes_sefaz_n3",version:1,data:state},null,2)],{type:"application/json"});let url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="agentes-ia-sefaz-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};el("restore").onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(obj.schema!=="agentes_sefaz_n3"||!obj.data||!Array.isArray(obj.data.records)||!Array.isArray(obj.data.imports))throw Error("Backup incompatível");if(confirm("Substituir dados locais do Agentes IA?")){state=obj.data;save();render()}}catch(err){alert(err.message)}};el("clear").onclick=()=>{if(confirm("Apagar todos os dados locais do Agentes IA?")){state=initial();save();render()}};el("install").onclick=()=>alert("No Chrome Android: menu ⋮ → Adicionar à tela inicial / Instalar aplicativo.")}}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
